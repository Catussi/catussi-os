<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --muted: #8b949e;
        --border: #30363d;
        --link: #58a6ff;
        --surface: #161b22;
        --text: #e6edf3;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #fff;
        --muted: #656d76;
        --border: #d0d7de;
        --link: #0969da;
        --surface: #f6f8fa;
        --text: #1f2328;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
      }
      header {
        align-items: center;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        justify-content: space-between;
        min-height: 44px;
        padding: 8px 14px;
      }
      #crumbs {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-width: 0;
      }
      header button {
        background: none;
        border: none;
        color: var(--link);
        cursor: pointer;
        font: inherit;
        padding: 0;
      }
      header button:hover {
        text-decoration: underline;
      }
      header .sep {
        color: var(--muted);
      }
      .open-real {
        background: #238636;
        border: 1px solid rgba(205, 217, 229, 0.1);
        border-radius: 6px;
        color: #fff;
        cursor: pointer;
        flex-shrink: 0;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 12px;
        text-decoration: none;
        white-space: nowrap;
      }
      .open-real:hover {
        background: #2ea043;
      }
      main {
        margin: 0 auto;
        max-width: 720px;
        padding: 14px 18px 24px;
      }
      .profile {
        display: grid;
        gap: 20px;
        grid-template-columns: 140px 1fr;
      }
      @media (max-width: 520px) {
        .profile {
          grid-template-columns: 1fr;
        }
      }
      .profile aside {
        padding: 0;
      }
      .avatar {
        border: 1px solid var(--border);
        border-radius: 50%;
        height: 72px;
        object-fit: cover;
        width: 72px;
      }
      .repos {
        min-width: 0;
      }
      .repo-grid {
        border-top: 1px solid var(--border);
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 2px;
      }
      h2 {
        border-bottom: none;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin: 0 0 8px;
        padding: 0;
        text-transform: uppercase;
      }
      .login,
      .desc,
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .repo-card {
        border-bottom: 1px solid var(--border);
        display: grid;
        gap: 2px 12px;
        grid-template-columns: 1fr auto;
        padding: 9px 0;
      }
      .repo-card:hover {
        background: var(--surface);
        margin: 0 -8px;
        padding-left: 8px;
        padding-right: 8px;
      }
      .repo-card button {
        background: none;
        border: none;
        color: var(--link);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        grid-column: 1;
        padding: 0;
        text-align: left;
      }
      .repo-card .desc {
        font-size: 12px;
        grid-column: 1 / -1;
        margin: 0;
      }
      .repo-card .stats {
        align-self: start;
        font-size: 11px;
        grid-column: 2;
        grid-row: 1;
        white-space: nowrap;
      }
      .lang-dot {
        border-radius: 50%;
        display: inline-block;
        height: 8px;
        margin-right: 4px;
        width: 8px;
      }
      .tabs {
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 4px;
        margin-bottom: 20px;
      }
      .tabs button {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        margin-bottom: -1px;
        padding: 8px 12px;
      }
      .tabs button.active {
        border-bottom-color: #fd8c73;
        color: var(--text);
        font-weight: 600;
      }
      .readme {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 24px 32px;
      }
      .readme pre {
        background: var(--surface);
        border-radius: 6px;
        overflow-x: auto;
        padding: 12px;
      }
      .file-list {
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .file-row {
        align-items: center;
        background: var(--bg);
        border: none;
        border-top: 1px solid var(--border);
        color: var(--link);
        cursor: pointer;
        display: flex;
        font: inherit;
        gap: 10px;
        padding: 8px 14px;
        text-align: left;
        width: 100%;
      }
      .file-row:first-child {
        border-top: none;
      }
      .file-row:hover {
        background: var(--surface);
      }
      .file-row .size {
        color: var(--muted);
        font-size: 12px;
        margin-left: auto;
      }
      .file-view pre {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.45;
        overflow: auto;
        padding: 16px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .loading,
      .error {
        color: var(--muted);
        padding: 40px;
        text-align: center;
      }
      .error {
        color: #cf222e;
      }
      .stats {
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 12px;
        gap: 14px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav id="crumbs" aria-label="Ruta"></nav>
      <a
        class="open-real"
        id="open-real"
        href="https://github.com/Catussi"
        target="_blank"
        rel="noopener noreferrer"
        onclick="window.open(this.href,'_blank','noopener,noreferrer'); return false;"
        >Abrir en navegador</a
      >
    </header>
    <main id="root"><div class="loading">Cargando…</div></main>
    <script src="/Program Files/Marked/marked.min.js"></script>
    <script src="/Program Files/Marked/purify.min.js"></script>
    <script>
      const syncOsTheme = () => {
        try {
          document.documentElement.dataset.theme =
            parent.document.documentElement.dataset.theme || "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      };
      syncOsTheme();
      try {
        new MutationObserver(syncOsTheme).observe(
          parent.document.documentElement,
          { attributeFilter: ["data-theme"] }
        );
      } catch {
        // The local profile remains dark when parent access is unavailable.
      }

      const API = "https://api.github.com";
      const CACHE_URL = "/Program Files/Browser/profiles/github-cache.json";
      const DEFAULT_OWNER = "Catussi";
      let tab = "readme";
      let profileCache = null;

      const loadCache = async () => {
        if (profileCache) return profileCache;
        try {
          const res = await fetch(CACHE_URL);
          if (res.ok) profileCache = await res.json();
        } catch {}
        return profileCache;
      };

      const fetchProfile = async (owner) => {
        try {
          const [user, repos] = await Promise.all([
            api(`/users/${owner}`),
            api(`/users/${owner}/repos?sort=pushed&per_page=100`),
          ]);
          return { user, repos, fromCache: false };
        } catch {
          const cache = await loadCache();
          if (cache?.user?.login?.toLowerCase() === owner.toLowerCase()) {
            return {
              user: cache.user,
              repos: cache.repos,
              fromCache: true,
              fetchedAt: cache.fetchedAt,
            };
          }
          throw new Error("no profile data");
        }
      };

      const parseHash = () => {
        const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
        return {
          owner: parts[0] || DEFAULT_OWNER,
          repo: parts[1] || "",
          branch: parts[2] || "main",
          path: parts.slice(3).join("/"),
        };
      };

      const setHash = ({ owner, repo, branch, path }) => {
        let hash = `#/${owner}`;
        if (repo) hash += `/${repo}`;
        if (path) hash += `/${branch || "main"}/${path}`;
        location.hash = hash;
      };

      const syncExternalLink = (loc) => {
        const openReal = document.getElementById("open-real");
        if (!openReal) return;

        let href = `https://github.com/${loc.owner || DEFAULT_OWNER}`;
        if (loc.repo) {
          href += `/${loc.repo}`;
          if (loc.path) {
            href += `/tree/${loc.branch || "main"}/${loc.path}`;
          }
        }
        openReal.href = href;
      };

      const api = async (path, init) => {
        const res = await fetch(`${API}${path}`, init);
        if (!res.ok) throw new Error(String(res.status));
        const type = res.headers.get("content-type") || "";
        if (type.includes("json")) return res.json();
        return res.text();
      };

      const formatBytes = (b) =>
        b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} KB` : `${(b / 1048576).toFixed(1)} MB`;

      const renderCrumbs = (loc) => {
        const crumbs = [{ label: "github.com", loc: { owner: loc.owner } }];
        if (loc.repo) crumbs.push({ label: loc.repo, loc: { owner: loc.owner, repo: loc.repo } });
        if (loc.path) {
          loc.path.split("/").reduce((p, seg) => {
            const next = p ? `${p}/${seg}` : seg;
            crumbs.push({
              label: seg,
              loc: { owner: loc.owner, repo: loc.repo, branch: loc.branch, path: next },
            });
            return next;
          }, "");
        }
        document.getElementById("crumbs").innerHTML = crumbs
          .map(
            (c, i) =>
              `${i ? '<span class="sep"> / </span>' : ""}<button type="button" data-i="${i}">${c.label}</button>`
          )
          .join("");
        document.getElementById("crumbs").querySelectorAll("button").forEach((btn) => {
          btn.onclick = () => setHash(crumbs[Number(btn.dataset.i)].loc);
        });
      };

      const LANG_COLORS = {
        TypeScript: "#3178c6",
        JavaScript: "#f1e05a",
        Python: "#3572A5",
        PHP: "#4F5D95",
        "Jupyter Notebook": "#DA5B0B",
        Java: "#b07219",
      };

      const langDot = (lang) => {
        const color = LANG_COLORS[lang] || "#8b949e";
        return `<span class="lang-dot" style="background:${color}"></span>${lang}`;
      };

      const renderProfile = async (owner) => {
        const { user, repos, fromCache, fetchedAt } = await fetchProfile(owner);
        const cacheNote = fromCache
          ? `<p class="desc" style="margin-top:12px">Vista en caché${
              fetchedAt
                ? ` · ${new Date(fetchedAt).toLocaleDateString("es-CL")}`
                : ""
            }. <a href="https://github.com/${user.login}" target="_blank" rel="noopener">Abrir en GitHub</a></p>`
          : "";
        document.getElementById("root").innerHTML = `
          <div class="profile">
            <aside>
              <img class="avatar" src="${user.avatar_url}" alt="@${user.login}" />
              <h1>${user.name || user.login}</h1>
              <p class="login">@${user.login}</p>
              ${user.bio ? `<p>${user.bio}</p>` : ""}
              <div class="meta">${user.location || ""}</div>
              <div class="stats">
                <span><strong>${user.public_repos}</strong> repos</span>
                <span><strong>${user.followers}</strong> seguidores</span>
              </div>
              ${cacheNote}
            </aside>
            <section class="repos">
              <h2>Repositorios <span class="desc" style="font-weight:400">(${repos.length})</span></h2>
              <div class="repo-grid">${repos
                .map(
                  (r) => `
                <article class="repo-card">
                  <button type="button" data-repo="${r.name}">${r.name}</button>
                  <div class="stats">
                    ${r.language ? langDot(r.language) : ""}
                    <span>★ ${r.stargazers_count ?? 0}</span>
                  </div>
                  <p class="desc">${r.description || ""}</p>
                </article>`
                )
                .join("")}</div>
            </section>
          </div>`;
        document.querySelectorAll("[data-repo]").forEach((btn) => {
          btn.onclick = () => setHash({ owner, repo: btn.dataset.repo });
        });
      };

      const renderRepoFallback = async (loc) => {
        const cache = await loadCache();
        const cached = cache?.repos?.find(
          (r) => r.name.toLowerCase() === loc.repo.toLowerCase()
        );
        if (!cached) throw new Error("no repo cache");

        document.getElementById("root").innerHTML = `
          <h1>${loc.owner}/${cached.name}</h1>
          <p class="desc">${cached.description || ""}</p>
          <div class="stats" style="margin-bottom:20px">
            ${cached.language ? `<span>${cached.language}</span>` : ""}
            <span>★ ${cached.stargazers_count ?? 0}</span>
          </div>
          <p class="desc">README y archivos no están disponibles sin la API de GitHub.</p>
          <p><a href="${cached.html_url}" target="_blank" rel="noopener">Ver repositorio en github.com →</a></p>`;
      };

      const renderRepo = async (loc) => {
        let repo;
        try {
          repo = await api(`/repos/${loc.owner}/${loc.repo}`);
        } catch {
          await renderRepoFallback(loc);
          return;
        }
        const branch = loc.branch || repo.default_branch || "main";

        if (loc.path) {
          const result = await api(
            `/repos/${loc.owner}/${loc.repo}/contents/${loc.path
              .split("/")
              .map(encodeURIComponent)
              .join("/")}`
          );
          if (!Array.isArray(result) && result.type === "file") {
            let content = "Archivo no disponible.";
            if (result.size > 500000) content = `Archivo grande (${formatBytes(result.size)}).`;
            else if (result.download_url) {
              const res = await fetch(result.download_url);
              content = await res.text();
            }
            document.getElementById("root").innerHTML = `
              <div class="file-view">
                <p class="desc">${loc.path}</p>
                <pre>${content.replace(/</g, "&lt;")}</pre>
              </div>`;
            return;
          }
          if (Array.isArray(result)) {
            document.getElementById("root").innerHTML = `
              <h1>${repo.full_name}/${loc.path.split("/").pop() || ""}</h1>
              <div class="file-list">${result
                .map(
                  (e) => `
                <button class="file-row" type="button" data-path="${e.path}">
                  <span>${e.type === "dir" ? "📁" : "📄"}</span>
                  <span>${e.name}</span>
                  ${e.type === "file" ? `<span class="size">${formatBytes(e.size)}</span>` : ""}
                </button>`
                )
                .join("")}</div>`;
            document.querySelectorAll("[data-path]").forEach((btn) => {
              btn.onclick = () =>
                setHash({ owner: loc.owner, repo: loc.repo, branch, path: btn.dataset.path });
            });
            return;
          }
        }

        const [readme, contents] = await Promise.all([
          fetch(`${API}/repos/${loc.owner}/${loc.repo}/readme`, {
            headers: { Accept: "application/vnd.github.raw" },
          }).then((r) => (r.ok ? r.text() : null)),
          api(`/repos/${loc.owner}/${loc.repo}/contents`),
        ]);

        const readmeHtml =
          readme && window.marked && window.DOMPurify
            ? window.DOMPurify.sanitize(
                window.marked.parse(readme, { headerIds: false, mangle: false })
              )
            : `<pre>${readme || "Sin README."}</pre>`;

        document.getElementById("root").innerHTML = `
          <h1>${repo.full_name}</h1>
          <p class="desc">${repo.description || ""}</p>
          <nav class="tabs">
            <button type="button" id="tab-readme" class="${tab === "readme" ? "active" : ""}">README</button>
            <button type="button" id="tab-files" class="${tab === "files" ? "active" : ""}">Archivos</button>
          </nav>
          <div id="tab-panel"></div>`;

        const panel = document.getElementById("tab-panel");
        const showTab = (name) => {
          tab = name;
          document.getElementById("tab-readme").classList.toggle("active", name === "readme");
          document.getElementById("tab-files").classList.toggle("active", name === "files");
          if (name === "readme") {
            panel.innerHTML = `<div class="readme">${readmeHtml}</div>`;
            panel.querySelectorAll("a").forEach((a) => {
              a.addEventListener("click", (e) => {
                const href = a.getAttribute("href") || "";
                if (href.includes("github.com")) {
                  e.preventDefault();
                  try {
                    const u = new URL(href);
                    const p = u.pathname.split("/").filter(Boolean);
                    if (p[0] && p[1]) setHash({ owner: p[0], repo: p[1] });
                  } catch {}
                }
              });
            });
          } else {
            panel.innerHTML = `<div class="file-list">${(Array.isArray(contents) ? contents : [])
              .map(
                (e) => `
              <button class="file-row" type="button" data-path="${e.path}">
                <span>${e.type === "dir" ? "📁" : "📄"}</span>
                <span>${e.name}</span>
                ${e.type === "file" ? `<span class="size">${formatBytes(e.size)}</span>` : ""}
              </button>`
              )
              .join("")}</div>`;
            panel.querySelectorAll("[data-path]").forEach((btn) => {
              btn.onclick = () =>
                setHash({ owner: loc.owner, repo: loc.repo, branch, path: btn.dataset.path });
            });
          }
        };
        document.getElementById("tab-readme").onclick = () => showTab("readme");
        document.getElementById("tab-files").onclick = () => showTab("files");
        showTab(tab);
      };

      const render = async () => {
        const loc = parseHash();
        renderCrumbs(loc);
        syncExternalLink(loc);
        document.getElementById("root").innerHTML = '<div class="loading">Cargando…</div>';
        try {
          if (!loc.repo) await renderProfile(loc.owner);
          else await renderRepo(loc);
        } catch {
          document.getElementById("root").innerHTML =
            '<div class="error">No se pudo cargar. Revisa la conexión o el límite de la API de GitHub.</div>';
        }
      };

      window.addEventListener("hashchange", render);
      if (!location.hash) location.hash = `#/${DEFAULT_OWNER}`;
      render();
    </script>
  </body>
</html>
