<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube</title>
    <style>
      html,
      body {
        background: #0f0f0f;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      iframe {
        border: 0;
        display: block;
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <iframe
      id="frame"
      title="YouTube"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
      referrerpolicy="no-referrer"
    ></iframe>
    <script>
      var INSTANCES = [
        "https://yewtu.be",
        "https://invidious.fdn.fr",
        "https://vid.puffyan.us",
      ];

      var instanceIndex = 0;
      var frame = document.getElementById("frame");

      var parseVideoId = function (input) {
        var raw = (input || "").trim();
        if (!raw) return "";
        if (/^[\w-]{11}$/.test(raw)) return raw;

        try {
          var url = new URL(raw.replace(/^http:/i, "https://"));
          var host = url.hostname.replace(/^www\./, "").replace(/^m\./, "");

          if (host === "youtu.be") {
            return url.pathname.slice(1).split("/")[0] || "";
          }

          if (host === "youtube.com") {
            var fromQuery = url.searchParams.get("v");
            if (fromQuery) return fromQuery;

            var parts = url.pathname.split("/").filter(Boolean);
            if (
              parts[1] &&
              ["embed", "shorts", "live", "v"].indexOf(parts[0]) !== -1
            ) {
              return parts[1];
            }
          }
        } catch (e) {
          /* ignore */
        }

        return "";
      };

      var currentBase = function () {
        return INSTANCES[instanceIndex] || INSTANCES[0];
      };

      var toInvidiousUrl = function (youtubeUrl) {
        var base = currentBase();

        try {
          var url = new URL(youtubeUrl.replace(/^http:/i, "https://"));
          var host = url.hostname.replace(/^www\./, "").replace(/^m\./, "");
          var videoId = parseVideoId(youtubeUrl);

          if (videoId) {
            return base + "/watch?v=" + encodeURIComponent(videoId);
          }

          if (host === "youtube.com") {
            var query = url.searchParams.get("search_query");

            if (query) {
              return (
                base + "/search?q=" + encodeURIComponent(query)
              );
            }

            if (
              url.pathname.indexOf("/@") === 0 ||
              url.pathname.indexOf("/channel/") === 0 ||
              url.pathname.indexOf("/c/") === 0 ||
              url.pathname.indexOf("/user/") === 0 ||
              url.pathname.indexOf("/playlist") === 0
            ) {
              return base + url.pathname + url.search;
            }
          }
        } catch (e) {
          /* ignore */
        }

        return base + "/";
      };

      var routeFromHash = function () {
        var raw = (location.hash || "").replace(/^#/, "");

        if (!raw) return currentBase() + "/";

        try {
          if (raw.indexOf("http") === 0) {
            return toInvidiousUrl(decodeURIComponent(raw));
          }
        } catch (e) {
          /* ignore */
        }

        var id = parseVideoId(decodeURIComponent(raw.replace(/^\//, "")));

        if (id) {
          return currentBase() + "/watch?v=" + encodeURIComponent(id);
        }

        return currentBase() + "/";
      };

      var load = function () {
        frame.src = routeFromHash();
      };

      var tryNextInstance = function () {
        if (instanceIndex >= INSTANCES.length - 1) return;

        instanceIndex += 1;
        load();
      };

      frame.addEventListener("error", tryNextInstance);

      window.addEventListener("hashchange", load);
      load();
    </script>
  </body>
</html>
